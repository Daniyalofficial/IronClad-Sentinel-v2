# Template only -- never commit real values. Create it out of band:
#
#   kubectl -n ironclad create secret generic ironclad-secrets \
#     --from-literal=IRONCLAD_SIGNING_KEY="$(openssl rand -hex 32)" \
#     --from-literal=IRONCLAD_DATABASE_URL="postgresql+psycopg2://user:pass@host:5432/ironclad"
#
# Or manage it with ExternalSecrets/Sealed Secrets/Vault and delete this file.
apiVersion: v1
kind: Secret
metadata:
  name: ironclad-secrets
  namespace: ironclad
type: Opaque
stringData:
  IRONCLAD_SIGNING_KEY: "REPLACE_ME_WITH_32_PLUS_CHARS"
  IRONCLAD_DATABASE_URL: "postgresql+psycopg2://REPLACE_ME"
