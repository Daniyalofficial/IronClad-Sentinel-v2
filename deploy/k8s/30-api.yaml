apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironclad-api
  namespace: ironclad
  labels: {app: ironclad-api}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: ironclad-api}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: ironclad-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/daniyalofficial/ironclad-sentinel:1.1.0
          args: ["api"]
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - configMapRef: {name: ironclad-config}
            - secretRef: {name: ironclad-secrets}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: work, mountPath: /work, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: work
          persistentVolumeClaim: {claimName: ironclad-scan-targets}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ironclad-api
  namespace: ironclad
  labels: {app: ironclad-api}
spec:
  selector: {app: ironclad-api}
  ports: [{name: http, port: 80, targetPort: http}]
