name: IronClad verification

on:
  push:
    branches:
      - main
      - hardening-v2
      - 'hardening-pass-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Tests
        run: pytest -q

      - name: CLI smoke test
        run: python -m ironclad.cli --help

      - name: SBOM smoke test
        run: |
          python -m ironclad.cli sbom tests/security_corpus/sbom_license --out /tmp/ironclad-sbom.json --project-name ironclad-ci
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('/tmp/ironclad-sbom.json').read_text())
          assert doc['bomFormat'] == 'CycloneDX'
          assert doc['specVersion'] == '1.5'
          assert isinstance(doc['components'], list)
          assert len(doc['components']) >= 1
          assert len({(c['name'], c['version']) for c in doc['components']}) == len(doc['components'])
          print(f"SBOM verified: {len(doc['components'])} unique components")
          PY

      - name: SARIF smoke test
        run: |
          rm -rf /tmp/ironclad-sarif
          python -m ironclad.cli scan tests/security_corpus --format sarif --output-dir /tmp/ironclad-sarif --quiet
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = list(Path('/tmp/ironclad-sarif').glob('*.sarif')) + list(Path('/tmp/ironclad-sarif').glob('*.json'))
          assert candidates, 'No SARIF report generated'
          doc = json.loads(candidates[0].read_text())
          assert doc['version'] == '2.1.0'
          assert len(doc['runs']) == 1
          assert doc['runs'][0]['tool']['driver']['name'] == 'IronClad Sentinel'
          print('SARIF contract verified')
          PY

      - name: Offline corpus scan
        run: |
          python -m ironclad.cli scan tests/security_corpus --format json > /tmp/ironclad-corpus.json
          test -s /tmp/ironclad-corpus.json
