name: IronClad verification

on:
  push:
    branches: [main, hardening-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Tests
        run: pytest -q

      - name: CLI smoke test
        run: python -m ironclad.cli --help

      - name: Offline corpus scan
        run: |
          python -m ironclad.cli scan tests/security_corpus --format json > /tmp/ironclad-corpus.json
          test -s /tmp/ironclad-corpus.json
