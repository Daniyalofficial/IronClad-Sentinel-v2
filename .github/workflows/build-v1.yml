name: IronClad Sentinel v2 build and verification

on:
  push:
    branches: [build-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap from audited baseline and harden
        if: hashFiles('.ironclad_v2_bootstrapped') == ''
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --quiet https://github.com/Daniyalofficial/New-project-1.git "$tmp/src"
          cd "$tmp/src"
          git checkout --quiet 9974a339289785eb389bb50c71a8eb843cdadbe7
          rm -rf .git
          cp -a . "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"

          python - <<'PY'
          from pathlib import Path

          walker = Path('ironclad/core/walker.py')
          s = walker.read_text()
          old = '''            for ignore_pattern in config.ignore_paths:\n                if fnmatch.fnmatch(rel_path, ignore_pattern):\n                    fileset.skipped += 1\n                    continue\n'''
          new = '''            if _matches_any_glob(rel_path, config.ignore_paths):\n                fileset.skipped += 1\n                continue\n\n            if config.include_globs and not _matches_any_glob(rel_path, config.include_globs):\n                fileset.skipped += 1\n                continue\n'''
          if old not in s:
              raise SystemExit('walker hardening target not found')
          walker.write_text(s.replace(old, new))

          engine = Path('ironclad/core/engine.py')
          s = engine.read_text()
          marker = '    all_findings: List[Finding] = []\n    lines_scanned = 0\n'
          replacement = '''    all_findings: List[Finding] = []\n    lines_scanned = 0\n    for discovered in fileset.files:\n        try:\n            with open(discovered.path, "r", encoding="utf-8", errors="ignore") as fh:\n                lines_scanned += sum(1 for _ in fh)\n        except OSError:\n            pass\n'''
          if marker not in s:
              raise SystemExit('engine statistics target not found')
          engine.write_text(s.replace(marker, replacement, 1))

          Path('tests/security_corpus').mkdir(parents=True, exist_ok=True)
          Path('tests/security_corpus/vulnerable_sql.py').write_text('''import sqlite3\n\ndef lookup(user_input):\n    conn = sqlite3.connect(":memory:")\n    query = "SELECT * FROM users WHERE name = '%s'" % user_input\n    return conn.execute(query).fetchall()\n''')
          Path('tests/security_corpus/safe_sql.py').write_text('''import sqlite3\n\ndef lookup(user_input):\n    conn = sqlite3.connect(":memory:")\n    return conn.execute("SELECT * FROM users WHERE name = ?", (user_input,)).fetchall()\n''')
          Path('tests/security_corpus/hardcoded_secret.py').write_text('''API_KEY = "AKIA1234567890EXAMPLE"\nPASSWORD = "super-secret-password-123"\n''')
          Path('tests/security_corpus/safe_config.py').write_text('''import os\nAPI_KEY = os.environ.get("API_KEY")\n''')

          Path('tests/test_v2_hardening.py').write_text('''from pathlib import Path\n\nfrom ironclad.core.config import IronCladConfig\nfrom ironclad.core.walker import discover\nfrom ironclad.core.engine import run_scan\n\nROOT = Path(__file__).parent / "security_corpus"\n\ndef test_ignore_paths_really_excludes_files(tmp_path):\n    (tmp_path / "keep.py").write_text("x = 1\\n")\n    (tmp_path / "ignored.py").write_text("x = 2\\n")\n    cfg = IronCladConfig(target=str(tmp_path), ignore_paths=["ignored.py"])\n    files = discover(cfg)\n    assert [f.rel_path for f in files.files] == ["keep.py"]\n\ndef test_include_globs_really_limits_files(tmp_path):\n    (tmp_path / "a.py").write_text("x = 1;\\n")\n    (tmp_path / "b.js").write_text("const x = 1;\\n")\n    cfg = IronCladConfig(target=str(tmp_path), include_globs=["*.py"])\n    files = discover(cfg)\n    assert [f.rel_path for f in files.files] == ["a.py"]\n\ndef test_line_statistics_are_populated():\n    cfg = IronCladConfig(target=str(ROOT), enabled_engines=["ast-python", "secrets", "rule-engine"])\n    result = run_scan(cfg)\n    assert result.stats.lines_scanned > 0\n    assert result.stats.files_scanned >= 4\n''')

          touch .ironclad_v2_bootstrapped
          git config user.name "IronClad Sentinel Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: bootstrap and harden IronClad Sentinel v2"
          git push origin HEAD:build-v1

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e . pytest

      - name: Run test suite
        run: pytest -q

      - name: Run CLI help smoke test
        run: python -m ironclad.cli --help

      - name: Run security corpus smoke scan
        run: python -m ironclad.cli scan tests/security_corpus --format json --output /tmp/ironclad-smoke.json || true

      - name: Publish verification summary
        if: always()
        run: |
          echo '## IronClad Sentinel v2 verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Bootstrap/hardening workflow executed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unit/integration test suite executed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- CLI smoke test executed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Security corpus smoke scan executed.' >> "$GITHUB_STEP_SUMMARY"
