rules:
  - id: SECRET-AWS-ACCESS-KEY-ID
    title: Hardcoded AWS Access Key ID
    languages: ["*"]
    severity: critical
    category: secrets
    cwe: CWE-798
    owasp: "A07:2021-Identification and Authentication Failures"
    pattern: '(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'
    message: >
      A string matching the AWS Access Key ID format was found hardcoded
      in source. If valid and active, this grants direct access to cloud
      resources.
    remediation: >
      Revoke this key immediately in the AWS IAM console, then load
      credentials via environment variables, an instance role, or a
      secrets manager -- never commit them to source control.
    confidence: high

  - id: SECRET-AWS-SECRET-KEY
    title: Hardcoded AWS Secret Access Key
    languages: ["*"]
    severity: critical
    category: secrets
    cwe: CWE-798
    pattern: '(?i)aws_secret_access_key\s*[:=]\s*["\x27]?[A-Za-z0-9/+=]{40}["\x27]?'
    message: An AWS secret access key appears to be hardcoded in source.
    remediation: Revoke and rotate the key; load secrets from a vault/secret manager.
    confidence: high

  - id: SECRET-PRIVATE-KEY-BLOCK
    title: Embedded private key material
    languages: ["*"]
    severity: critical
    category: secrets
    cwe: CWE-798
    pattern: '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
    message: >
      A PEM-encoded private key is embedded directly in source/config.
      Anyone with repository access can extract and use this key.
    remediation: Remove the key from source control, rotate it, and load it at runtime from a secrets manager or mounted secret volume.
    confidence: high

  - id: SECRET-GENERIC-API-KEY
    title: Generic high-entropy API key assignment
    languages: ["*"]
    severity: high
    category: secrets
    cwe: CWE-798
    pattern: '(?i)(api[_-]?key|apikey)\s*[:=]\s*["\x27][A-Za-z0-9_\-]{20,}["\x27]'
    exclude_if_matches: '(?i)env|getenv|process\.env|example|placeholder|xxxx|dummy|changeme'
    message: A likely real API key value is hardcoded rather than loaded from configuration.
    remediation: Move to environment variables or a secrets manager.
    confidence: medium

  - id: SECRET-SLACK-TOKEN
    title: Hardcoded Slack token
    languages: ["*"]
    severity: high
    category: secrets
    cwe: CWE-798
    pattern: 'xox[baprs]-[0-9A-Za-z-]{10,}'
    message: A Slack API token (bot/user/app) was found hardcoded in source.
    remediation: Revoke the token in the Slack app settings and load it from environment configuration.
    confidence: high

  - id: SECRET-GITHUB-TOKEN
    title: Hardcoded GitHub personal access token
    languages: ["*"]
    severity: critical
    category: secrets
    cwe: CWE-798
    pattern: '(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}'
    message: A GitHub personal access / OAuth / app token was found hardcoded in source.
    remediation: Revoke the token immediately on GitHub, then use GitHub Actions secrets or environment configuration.
    confidence: high

  - id: SECRET-STRIPE-KEY
    title: Hardcoded Stripe API key
    languages: ["*"]
    severity: critical
    category: secrets
    cwe: CWE-798
    pattern: '(sk|rk)_(live|test)_[A-Za-z0-9]{16,}'
    message: A Stripe secret/restricted API key was found hardcoded in source.
    remediation: Roll the key in the Stripe dashboard and load it from environment configuration.
    confidence: high

  - id: SECRET-GOOGLE-API-KEY
    title: Hardcoded Google API key
    languages: ["*"]
    severity: high
    category: secrets
    cwe: CWE-798
    pattern: 'AIza[0-9A-Za-z_\-]{35}'
    message: A Google API key was found hardcoded in source.
    remediation: Restrict/rotate the key in Google Cloud Console and load it from environment configuration.
    confidence: high

  - id: SECRET-DATABASE-CONNECTION-STRING
    title: Hardcoded database connection string with credentials
    languages: ["*"]
    severity: high
    category: secrets
    cwe: CWE-798
    pattern: '(postgres|postgresql|mysql|mongodb(\+srv)?|redis):\/\/[^:\s]+:[^@\s]+@'
    message: >
      A database connection string with an embedded username/password was
      found hardcoded in source or configuration.
    remediation: Load connection credentials from environment variables or a secrets manager, not from a literal connection string in source.
    confidence: high

  - id: SECRET-SLACK-WEBHOOK
    title: Hardcoded Slack webhook URL
    languages: ["*"]
    severity: medium
    category: secrets
    cwe: CWE-798
    pattern: 'hooks\.slack\.com\/services\/[A-Za-z0-9/]{20,}'
    message: A Slack incoming webhook URL is hardcoded; anyone with this URL can post messages to the channel.
    remediation: Move the webhook URL to environment configuration and rotate it.
    confidence: high

  - id: SECRET-BASIC-AUTH-URL
    title: Credentials embedded in a URL
    languages: ["*"]
    severity: medium
    category: secrets
    cwe: CWE-798
    pattern: 'https?:\/\/[^:\/\s]+:[^@\/\s]+@[^\/\s]+'
    exclude_if_matches: 'example\.com|localhost|user:pass|username:password'
    message: A URL contains embedded basic-auth credentials.
    remediation: Move credentials out of the URL and into headers/environment configuration.
    confidence: low
