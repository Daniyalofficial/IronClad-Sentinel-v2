# IronClad Sentinel rule pack. Schema: ironclad/rules/schema.py
# Every rule needs: id, severity, confidence, category, pattern, message, remediation.
rules:
- id: PHP-SUPERGLOBAL-IN-SQL
  title: Request superglobal used directly in a query
  languages:
  - php
  severity: critical
  category: injection
  cwe: CWE-89
  owasp: A03:2021-Injection
  pattern: (query|execute)\s*\(\s*["'][^"']*["']\s*\.\s*\$_(GET|POST|REQUEST|COOKIE)|(query|execute)\s*\(\s*["'][^"']*(SELECT|INSERT
    INTO|UPDATE|DELETE FROM)[^"']*\$_(GET|POST|REQUEST|COOKIE)
  message: 'A request superglobal is interpolated straight into a SQL statement: directly exploitable
    SQL injection.'
  remediation: Use PDO/mysqli prepared statements with bound parameters; never interpolate superglobals
    into SQL.
  confidence: high
  references:
  - https://cwe.mitre.org/data/definitions/89.html
- id: PHP-ECHO-SUPERGLOBAL
  title: Request superglobal echoed without escaping
  languages:
  - php
  severity: high
  category: xss
  cwe: CWE-79
  owasp: A03:2021-Injection
  pattern: (echo|print)\s+[^;]*\$_(GET|POST|REQUEST|COOKIE)
  message: Unescaped request data is written to the response, producing reflected cross-site scripting.
  remediation: Wrap output in htmlspecialchars($value, ENT_QUOTES, 'UTF-8').
  confidence: high
  exclude_if_matches: htmlspecialchars|htmlentities
  references:
  - https://cwe.mitre.org/data/definitions/79.html
- id: PHP-DYNAMIC-INCLUDE
  title: Dynamic file inclusion
  languages:
  - php
  severity: critical
  category: path-traversal
  cwe: CWE-98
  owasp: A03:2021-Injection
  pattern: (include|require)(_once)?\s*\(?\s*[^;]*\$_(GET|POST|REQUEST)
  message: An include/require path is built from request data, allowing local file inclusion or remote
    code execution.
  remediation: Map user input to a fixed allowlist of files; never build an include path from request
    data.
  confidence: high
  references:
  - https://cwe.mitre.org/data/definitions/98.html
- id: PHP-COMMAND-SUPERGLOBAL
  title: Request superglobal passed to a shell function
  languages:
  - php
  severity: critical
  category: injection
  cwe: CWE-78
  owasp: A03:2021-Injection
  pattern: (system|exec|shell_exec|passthru|popen|proc_open)\s*\(\s*[^;]*\$_(GET|POST|REQUEST)
  message: 'Request data reaches a shell execution function: OS command injection.'
  remediation: Avoid shell execution; if unavoidable use escapeshellarg() on every argument and an allowlisted
    command name.
  confidence: high
  references:
  - https://cwe.mitre.org/data/definitions/78.html
- id: PHP-WEAK-PASSWORD-HASH
  title: Password hashed with a fast/broken algorithm
  languages:
  - php
  severity: high
  category: crypto
  cwe: CWE-916
  owasp: A02:2021-Cryptographic Failures
  pattern: \b(md5|sha1|crc32)\s*\(\s*\$[a-zA-Z_]*(pass|pwd|secret)
  message: A password is hashed with a general-purpose digest; these are fast by design so offline brute
    force is practical.
  remediation: Use password_hash() with PASSWORD_ARGON2ID or PASSWORD_BCRYPT.
  confidence: high
  references:
  - https://cwe.mitre.org/data/definitions/916.html
