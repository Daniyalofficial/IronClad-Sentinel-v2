[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironclad-sentinel"
version = "1.0.0"
description = "Offline, self-hosted Application Security scanning platform -- SAST, secrets, dependency, IaC, and license-compliance scanning with zero telemetry and zero network calls."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "IronClad Sentinel" }]
keywords = ["security", "sast", "appsec", "secrets-detection", "sbom", "offline", "self-hosted"]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "rich>=13.0",
    "Jinja2>=3.1",
    "cryptography>=41.0",
]

[project.scripts]
ironclad = "ironclad.cli:main"

[tool.setuptools.packages.find]
include = ["ironclad*"]

[tool.setuptools.package-data]
ironclad = [
    "rules/packs/*.yml",
    "data/*.json",
    "reporting/templates/*.j2",
    "licensing/vendor_public_key.pem",
]
