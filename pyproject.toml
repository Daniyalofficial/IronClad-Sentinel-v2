[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironclad-sentinel"
version = "1.1.0"
description = "Offline, self-hosted Application Security scanning platform -- SAST, secrets, dependency, IaC, and license-compliance scanning with zero telemetry and zero network calls."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "IronClad Sentinel" }]
keywords = ["security", "sast", "appsec", "secrets-detection", "sbom", "offline", "self-hosted"]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "rich>=13.0",
    "Jinja2>=3.1",
    "cryptography>=41.0",
]

# The scanner core stays dependency-light; the server (API + dashboard +
# database) is an explicit extra so an air-gapped scan-only install does not
# need a web stack.
[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7.4", "httpx>=0.27", "build>=1.0"]

[project.scripts]
ironclad = "ironclad.cli:_safe_main"

[tool.setuptools.packages.find]
include = ["ironclad*"]

[tool.setuptools.package-data]
ironclad = [
    "rules/packs/*.yml",
    "data/*.json",
    "reporting/templates/*.j2",
    "licensing/vendor_public_key.pem",
    "platform/migrations/*/*.sql",
    "web/templates/*.html",
    "web/static/*.css",
]
